name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy WebApp / PWA to GitHub Pages
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build WebApp & PWA
        run: pnpm --filter web build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  build-windows:
    name: Build Windows (NSIS & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install

      - name: Build Web Frontend
        run: pnpm --filter web build

      - name: Build Tauri Desktop (NSIS & Binary)
        run: pnpm --filter @zerop7m/tauri exec tauri build

      - name: Package Windows Artifacts
        shell: bash
        run: |
          mkdir -p release-win
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          
          # In Cargo workspace, target is at repo root: target/release
          NSIS_FILE=$(find target/release/bundle/nsis -type f -name "*.exe" 2>/dev/null | head -n 1 || true)
          if [ -z "$NSIS_FILE" ]; then
            NSIS_FILE=$(find target/release -type f -name "*setup*.exe" 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$NSIS_FILE" ]; then
            NSIS_FILE=$(find . -name "*setup*.exe" -type f 2>/dev/null | head -n 1 || true)
          fi
          
          if [ -n "$NSIS_FILE" ]; then
            echo "Found NSIS installer: $NSIS_FILE"
            cp "$NSIS_FILE" "release-win/ZeroP7M-${VERSION}-x64-setup.exe"
          fi

          # Portable binary: target/release/ZeroP7M.exe, zerop7m-tauri.exe, etc.
          PORTABLE_FILE=$(find target/release -maxdepth 1 \( -name "*zerop7m*.exe" -o -name "*ZeroP7M*.exe" \) ! -name "*setup*" -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$PORTABLE_FILE" ]; then
            PORTABLE_FILE=$(find target/release -maxdepth 1 -name "*.exe" ! -name "*setup*" ! -name "benchmark*" -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$PORTABLE_FILE" ]; then
            echo "Found Portable binary: $PORTABLE_FILE"
            cp "$PORTABLE_FILE" "release-win/ZeroP7M-${VERSION}-x64-portable.exe"
          fi

          echo "release-win contents:"
          ls -la release-win/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release-win/*
          if-no-files-found: error

  build-android:
    name: Build Android (ARM64 APK)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android NDK
        run: |
          # Use stable LTS NDK (r26 or r27), avoiding canary r30
          STABLE_NDK=$(ls -1d $ANDROID_HOME/ndk/27* $ANDROID_HOME/ndk/26* $ANDROID_HOME/ndk/25* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$STABLE_NDK" ]; then
            STABLE_NDK=$(ls -1d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "NDK_HOME=$STABLE_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$STABLE_NDK" >> $GITHUB_ENV
          echo "Using Android NDK: $STABLE_NDK"

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install

      - name: Build Web Frontend
        run: pnpm --filter web build

      - name: Initialize Android Target
        run: |
          pnpm --filter @zerop7m/tauri exec tauri android init --ci
          # Safely inject .p7m intent filters into the generated AndroidManifest.xml
          python scripts/inject_android_manifest.py apps/tauri/src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          pnpm --filter @zerop7m/tauri exec tauri android build --apk --target aarch64

      - name: Package & Sign Android Artifact
        shell: bash
        run: |
          mkdir -p release-android
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          
          # Find generated APK in gen/android outputs
          APK_FILE=$(find apps/tauri/src-tauri/gen/android -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
              KEYSTORE_PATH="release.keystore"
              KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
              KEY_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            elif [ -f "keystore/release.keystore" ]; then
              echo "Using committed permanent open-source release keystore..."
              KEYSTORE_PATH="keystore/release.keystore"
              KEY_ALIAS="zerop7m"
              KEY_PASS="zerop7m"
            else
              echo "Generating fallback keystore..."
              keytool -genkeypair -v -keystore release.keystore -alias zerop7m -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass zerop7m -keypass zerop7m -dname "CN=ZeroP7M Open Source Release, O=ZeroP7M, C=IT"
              KEYSTORE_PATH="release.keystore"
              KEY_ALIAS="zerop7m"
              KEY_PASS="zerop7m"
            fi
            
            BUILD_TOOLS_DIR=$(ls -1d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
              $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE_PATH" --ks-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "release-android/ZeroP7M-${VERSION}.apk" "$APK_FILE" || cp "$APK_FILE" "release-android/ZeroP7M-${VERSION}.apk"
            else
              cp "$APK_FILE" "release-android/ZeroP7M-${VERSION}.apk"
            fi
          else
            echo "ERROR: No APK generated by tauri android build"
            ls -la apps/tauri/src-tauri/gen/android/ || true
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-android/*
          if-no-files-found: error

  publish-release:
    name: Attestations & Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release distribution directory
        run: mkdir -p dist-release

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/
        continue-on-error: true

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: dist-release/
        continue-on-error: true

      - name: Generate Checksums (SHA256SUMS.txt)
        shell: bash
        run: |
          cd dist-release
          if ls * 1> /dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          else
            echo "No binaries found to hash." > SHA256SUMS.txt
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist-release/*'
        continue-on-error: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
