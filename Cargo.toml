[workspace]
resolver = "2"
members = [
    "crates/p7m-core",
    "crates/p7m-wasm",
    "apps/tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ZeroP7M Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rasn = "0.30.0"
rasn-cms = "0.30.0"
rasn-pkix = "0.30.0"
sha2 = "0.11"
sha1 = "0.11"
base64 = "0.22"
infer = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ts-rs = { version = "12.0", features = ["serde-compat"] }
rustix = ">=1.1.6"
